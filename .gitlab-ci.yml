.deploy_template: &deploy_template
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "🚀 Deploying to Kubernetes"
    - kubectl config get-contexts
    - kubectl config use-context slt6491334/marketplace-customer-frontend:$KUBE_CONTEXT
    - sed -i "s/<VERSION>/${IMAGE_TAG}/g" ./manifests/deployment.yaml
    - kubectl apply -f ./manifests/deployment.yaml -n $KUBE_NAMESPACE
    - kubectl apply -f ./manifests/service.yaml -n $KUBE_NAMESPACE

deploy_dev:
  <<: *deploy_template
  variables:
    KUBE_CONTEXT: dev-customer-front-agent
    KUBE_NAMESPACE: dev
  only:
    - dev
  environment:
    name: dev

deploy_qa:
  <<: *deploy_template
  variables:
    KUBE_CONTEXT: dev-customer-front-agent
    KUBE_NAMESPACE: qa
  only:
    - qa
  environment:
    name: qa

deploy_staging:
  <<: *deploy_template
  variables:
    KUBE_CONTEXT: dev-customer-front-agent
    KUBE_NAMESPACE: staging
  only:
    - staging
  environment:
    name: staging

deploy_staging:
  <<: *deploy_template
  variables:
    KUBE_CONTEXT: prod-customer-front-agent
    KUBE_NAMESPACE: webapp
  only:
    - main
  environment:
    name: prod